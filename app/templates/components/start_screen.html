<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-black">
    <div class="text-center max-w-md w-full">
        <p class="hero-reveal stagger-1 text-secondary text-sm mb-2">SOC OPS</p>
        <h1 class="hero-reveal stagger-2 text-5xl font-bold tracking-tight text-primary mb-3">Social Bingo</h1>
        <p class="hero-reveal stagger-2 text-lg text-secondary mb-10 leading-relaxed">Find people who match each square and complete a line.</p>

        <div class="hero-reveal stagger-3 apple-card p-6 mb-8 text-left">
            <h2 class="font-semibold text-primary mb-3 text-lg">How to play</h2>
            <ul class="text-secondary text-sm space-y-2 leading-relaxed">
                <li>• Find people who match the questions</li>
                <li>• Tap a square when you find a match</li>
                <li>• Get 5 in a row to win!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="hero-reveal stagger-3 btn btn-primary w-full py-4 px-8 text-lg">
            Start Game
        </button>
    </div>
</div>
</div>
